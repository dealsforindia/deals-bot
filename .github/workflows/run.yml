name: Deal Hunter

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# This is the most important fix for duplicate posts:
# Never allow two runs at the same time.
# If a run is already going, the next one WAITS instead of starting fresh.
concurrency:
  group: deal-hunter
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Libraries
        run: pip install requests feedparser

      - name: Run Deal Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          EARNKARO_TOKEN: ${{ secrets.EARNKARO_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Save Memory (Commit Changes)
        run: |
          git config --global user.name "DealBot"
          git config --global user.email "bot@noreply.github.com"

          # Step 1: Back up the freshly written memory files BEFORE any git operation
          cp seen_deals.json /tmp/seen_deals.json 2>/dev/null || true
          cp last_post_dealsforindia.txt /tmp/last_post_dealsforindia.txt 2>/dev/null || true
          cp last_post_dealsoffersfreebies.txt /tmp/last_post_dealsoffersfreebies.txt 2>/dev/null || true
          cp last_post_Lootdealsforindia.txt /tmp/last_post_Lootdealsforindia.txt 2>/dev/null || true

          # Step 2: Pull latest remote changes (in case another run pushed while we ran)
          git pull origin main --rebase || true

          # Step 3: Restore our fresh memory files on top of the pulled state
          cp /tmp/seen_deals.json seen_deals.json 2>/dev/null || true
          cp /tmp/last_post_dealsforindia.txt last_post_dealsforindia.txt 2>/dev/null || true
          cp /tmp/last_post_dealsoffersfreebies.txt last_post_dealsoffersfreebies.txt 2>/dev/null || true
          cp /tmp/last_post_Lootdealsforindia.txt last_post_Lootdealsforindia.txt 2>/dev/null || true

          # Step 4: Stage memory files
          git add seen_deals.json last_post_dealsforindia.txt last_post_dealsoffersfreebies.txt last_post_Lootdealsforindia.txt

          # Step 5: Only commit if something actually changed
          git diff --staged --quiet && echo "No changes to commit" && exit 0

          git commit -m "Update memory [skip ci]"

          # Step 6: Push with retry loop
          for i in 1 2 3; do
            git push origin main && echo "Push successful" && break
            echo "Attempt $i failed, pulling and retrying..."
            git pull origin main --rebase || true
          done
